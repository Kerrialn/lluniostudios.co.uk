; See https://docs.docker.com/desktop/networking/#i-want-to-connect-from-a-container-to-a-service-on-the-host
xdebug.client_host = host.docker.internal
; Re-check file mtimes on every request so edits take effect immediately.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; Uploads (Bespoke Commissions, decided 7 October 2026): up to 50MB a file
; and 100MB an enquiry. post_max_size leaves room for the rest of the form.
; Local only for now: the live server (10-app.ini, 10M/40M) needs the same
; limits at launch (merge plan, Step 12).
upload_max_filesize = 50M
post_max_size = 110M
max_file_uploads = 20
