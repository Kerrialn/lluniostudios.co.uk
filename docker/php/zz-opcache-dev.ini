; Development opcache overrides (loaded last via the `zz-` prefix).
;
; The base image ships with opcache.validate_timestamps=0, which is correct for
; production (code never changes at runtime) but means edited PHP files are NOT
; picked up until the container is restarted. In development we re-check file
; mtimes on every request so edits take effect immediately.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
