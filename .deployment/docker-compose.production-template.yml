version: "3.9"

networks:
  traefik:
    external: true
  internal:
    external: false

volumes:
  caddy_data:
  caddy_config:
  uploads:

services:
  # FrankenPHP: serves PHP and the static files in one container. Traefik
  # terminates TLS in front of it, so it listens on plain :80.
  php:
    image: ghcr.io/kerrialn/lluniostudios.co.uk-php:main
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Persist user-uploaded images (Vich writes them under public/uploads).
      - uploads:/app/public/uploads
    depends_on:
      - database
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      APP_ENV: "prod"
      DATABASE_URL: "postgresql://__LLUNIOSTUDIOS_POSTGRES_USER__:__LLUNIOSTUDIOS_POSTGRES_PASSWORD__@database:5432/__LLUNIOSTUDIOS_POSTGRES_DBNAME__?serverVersion=16&charset=utf8"
      APP_SECRET: "__LLUNIOSTUDIOS_APP_SECRET__"
      MAILER_DSN: "__LLUNIOSTUDIOS_MAILER_DSN__"
      STRIPE_PUBLISHABLE_KEY: "__LLUNIOSTUDIOS_STRIPE_PUBLISHABLE_KEY__"
      STRIPE_SECRET_KEY: "__LLUNIOSTUDIOS_STRIPE_SECRET_KEY__"
      STRIPE_WEBHOOK_SECRET: "__LLUNIOSTUDIOS_STRIPE_WEBHOOK_SECRET__"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lluniostudios.rule=Host(`lluniostudios.co.uk`, `www.lluniostudios.co.uk`)"
      - "traefik.http.routers.lluniostudios.tls=true"
      - "traefik.http.routers.lluniostudios.tls.certresolver=le"
      # The image exposes 80, 443 and 2019; Traefik must be told which to use.
      - "traefik.http.services.lluniostudios.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
    networks:
      - traefik
      - internal

  database:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: "__LLUNIOSTUDIOS_POSTGRES_DBNAME__"
      POSTGRES_PASSWORD: "__LLUNIOSTUDIOS_POSTGRES_PASSWORD__"
      POSTGRES_USER: "__LLUNIOSTUDIOS_POSTGRES_USER__"
    volumes:
      - ./db-data:/var/lib/postgresql/data:rw
    networks:
      - internal

  adminer:
    image: adminer:4.8.0
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: database
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lluniostudios-adminer.rule=Host(`adminer.lluniostudios.co.uk`)"
      - "traefik.http.routers.lluniostudios-adminer.tls=true"
      - "traefik.http.routers.lluniostudios-adminer.tls.certresolver=le"
    networks:
      - internal
      - traefik
