services:
    php:
        build:
            context: .
            target: frankenphp_dev
        environment:
            SERVER_NAME: localhost
            XDEBUG_MODE: "${XDEBUG_MODE:-off}"
        volumes:
            - .:/app
            - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
            - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
            - caddy_data:/data
            - caddy_config:/config
        extra_hosts:
            - host.docker.internal:host-gateway
        ports:
            # HTTP
            - target: 80
              published: 80
              protocol: tcp
            # HTTPS
            - target: 443
              published: 443
              protocol: tcp
            # HTTP/3
            - target: 443
              published: 443
              protocol: udp
        depends_on:
            - database

    database:
        image: postgis/postgis:16-3.4
        platform: linux/amd64   # note: runs under emulation on ARM hosts; remove this if you have a multi-arch image
        environment:
            POSTGRES_DB: LLUNIOSTUDIOS_DEV_DB_V1
            POSTGRES_PASSWORD: lluniostudios
            POSTGRES_USER: lluniostudios
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - db-data:/var/lib/postgresql/data
        ports:
            - "5432:5432"

    adminer:
        image: adminer:4.8.0
        ports:
            - "8000:8080"
        environment:
            ADMINER_DEFAULT_SERVER: database
        depends_on:
            - database

volumes:
    caddy_data:
    caddy_config:
    db-data:
